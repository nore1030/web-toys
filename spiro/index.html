<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万花尺 🌀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #12101a; color: #e8e4f2;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 26px 16px 50px; gap: 14px;
  }
  h1 { font-size: clamp(26px, 6vw, 36px); letter-spacing: 2px; }
  .sub { color: #8f86a8; font-size: 14px; text-align: center; line-height: 1.7; }
  #frame { background: #0b0a10; border-radius: 18px; box-shadow: 0 12px 36px rgba(0,0,0,.5); line-height: 0; }
  #cv { width: min(480px, 92vw); border-radius: 18px; }
  .tools { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .tools button {
    border: 1px solid #3a3352; background: transparent; color: #cfc7e8;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
  }
  .tools button:hover { background: #221d33; }
  .sliders { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .sliders label { font-size: 13px; color: #8f86a8; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sliders input[type=range] { accent-color: #b79cff; width: 130px; }
  .sliders b { color: #b79cff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>🌀 万花尺</h1>
<p class="sub">R 是大圆，r 是小齿轮，d 是笔孔位置。三个数字一调，转出一朵数学的花。</p>
<div id="frame"><canvas id="cv" width="480" height="480"></canvas></div>
<div class="sliders">
  <label>大圆 R <b id="vR">90</b><input type="range" id="R" min="60" max="140" value="90"></label>
  <label>齿轮 r <b id="vr">31</b><input type="range" id="r" min="10" max="89" value="31"></label>
  <label>笔距 d <b id="vd">70</b><input type="range" id="d" min="5" max="85" value="70"></label>
  <label>转速 <b id="vsp">快</b><input type="range" id="sp" min="1" max="10" value="5"></label>
</div>
<div class="tools">
  <button id="shuffle">🎲 随机一组</button>
  <button id="rainbow">🌈 彩虹/单色</button>
  <button id="save">💾 保存花纹</button>
</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const C = 240;
let R = 90, r = 31, d = 70, t = 0, rainbow = true;
let running = true;

function hue(t) { return (t * 8) % 360; }
function pt(t) {
  const k = (R - r) / r;
  return [
    C + (R - r) * Math.cos(t) + d * Math.cos(k * t),
    C + (R - r) * Math.sin(t) - d * Math.sin(k * t),
  ];
}
function reset() {
  ctx.fillStyle = "#0b0a10";
  ctx.fillRect(0, 0, 480, 480);
  t = 0;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  const [x0, y0] = pt(0);
  ctx.moveTo(x0, y0);
}
function step() {
  if (running) {
    const spd = +document.getElementById("sp").value;
    for (let i = 0; i < spd * 2; i++) {
      const [x, y] = pt(t);
      ctx.strokeStyle = rainbow ? `hsla(${hue(t)}, 88%, 66%, .9)` : "#b79cff";
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(...pt(t));
    t += 0.012;
    const total = 2 * Math.PI * r / gcd(R, r) + 0.6;
    if (t > total) {
      running = false;
      if (window.Toy) Toy.say("花转完了。放心，下一朵不会重样。");
    }
  }
  requestAnimationFrame(step);
}
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function syncLabels() {
  document.getElementById("vR").textContent = R;
  document.getElementById("vr").textContent = r;
  document.getElementById("vd").textContent = d;
}
["R", "r", "d"].forEach(id => {
  document.getElementById(id).addEventListener("input", e => {
    R = +document.getElementById("R").value;
    r = +document.getElementById("r").value;
    d = +document.getElementById("d").value;
    syncLabels();
    reset(); running = true;
  });
});
document.getElementById("sp").addEventListener("input", e => {
  document.getElementById("vsp").textContent = +e.target.value >= 8 ? "很快" : +e.target.value >= 5 ? "快" : +e.target.value >= 3 ? "中" : "慢";
});
document.getElementById("shuffle").addEventListener("click", () => {
  document.getElementById("R").value = R = 60 + Math.floor(Math.random() * 80);
  document.getElementById("r").value = r = 10 + Math.floor(Math.random() * 79);
  document.getElementById("d").value = d = 5 + Math.floor(Math.random() * 80);
  syncLabels();
  reset(); running = true;
});
document.getElementById("rainbow").addEventListener("click", function () {
  rainbow = !rainbow;
  this.textContent = rainbow ? "🌈 彩虹/单色" : "🌈 单色/彩虹";
  // 不清屏，直接换色继续
});
document.getElementById("save").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "万花尺.png";
  a.href = cv.toDataURL("image/png");
  a.click();
});
reset();
requestAnimationFrame(step);
window.__spiro = () => ({ t: +t.toFixed(1), running });
</script>
<script src="../toys-common.js" data-bgm="ambient" data-lines='["数学也可以很好看","随机一组，永远不重样","转完一朵花，只要十几秒"]'></script>
</body>
</html>
