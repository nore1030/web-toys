<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单格扫雷 💣</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0a6b5d;
    background-image: radial-gradient(circle at 25% 20%, rgba(255,255,255,.10) 0%, transparent 40%),
                      radial-gradient(circle at 75% 80%, rgba(0,0,0,.18) 0%, transparent 45%);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; user-select: none;
  }
  .win95 {
    width: min(340px, 92vw);
    background: #c0c0c0;
    border-top: 3px solid #fff; border-left: 3px solid #fff;
    border-right: 3px solid #5a5a5a; border-bottom: 3px solid #5a5a5a;
    box-shadow: 6px 8px 0 rgba(0, 0, 0, .3);
  }
  .titlebar {
    margin: 3px;
    background: linear-gradient(90deg, #000082, #1084d0);
    color: #fff; font-weight: 700; font-size: 13.5px;
    padding: 5px 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .titlebar .x {
    background: #c0c0c0; color: #000; width: 18px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; border-top: 1.5px solid #fff; border-left: 1.5px solid #fff;
    border-right: 1.5px solid #5a5a5a; border-bottom: 1.5px solid #5a5a5a;
  }
  .inner { margin: 10px; border-top: 2px solid #808080; border-left: 2px solid #808080;
           border-right: 2px solid #fff; border-bottom: 2px solid #fff; padding: 12px; }
  .statusline {
    display: flex; justify-content: space-between; align-items: center;
    font-family: ui-monospace, Menlo, monospace; font-weight: 900; font-size: 19px;
    background: #000; color: #f33; padding: 4px 8px; margin-bottom: 12px;
    border-top: 2px solid #808080; border-left: 2px solid #808080;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
  }
  #face { font-size: 30px; line-height: 1; }
  .board {
    display: flex; justify-content: center; padding: 14px 0 6px;
  }
  .cell {
    width: 64px; height: 64px; cursor: pointer;
    background: #c0c0c0;
    border-top: 3px solid #fff; border-left: 3px solid #fff;
    border-right: 3px solid #7b7b7b; border-bottom: 3px solid #7b7b7b;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    transition: transform .06s;
  }
  .cell:active { transform: scale(.96); }
  .cell.open { border: 2px solid #9a9a9a; background: #d6d6d6; }
  .msg {
    min-height: 24px; text-align: center; font-size: 14.5px; font-weight: 700; color: #222;
    padding-bottom: 4px;
  }
  .again-row { text-align: center; padding-bottom: 12px; display: none; }
  .again-row.show { display: block; }
  .again-row button {
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    background: #c0c0c0; border: none; padding: 8px 20px; cursor: pointer;
    border-top: 2px solid #fff; border-left: 2px solid #fff;
    border-right: 2px solid #5a5a5a; border-bottom: 2px solid #5a5a5a;
  }
  .blurb { color: #cfe9e2; font-size: 14.5px; text-align: center; line-height: 1.8; max-width: 420px; padding: 0 18px; }
  .blurb b { color: #ffd76e; }
</style>
</head>
<body>
<div class="win95">
  <div class="titlebar"><span>扫雷.exe（究极简化版）</span><span class="x">✕</span></div>
  <div class="inner">
    <div class="statusline"><span id="mines">💣 001</span><span id="face">🙂</span><span id="clock">000</span></div>
    <div class="board"><div class="cell" id="cell">❓</div></div>
    <div class="msg" id="msg">就一个格子。你不会踩雷的。大概。</div>
    <div class="again-row" id="againRow"><button id="again">再来一盘（反正还会赢）</button></div>
  </div>
</div>
<p class="blurb">扫雷十年，从未赢过？来这里。<br><b>这是全世界唯一一款你永远能赢的扫雷。</b></p>

<script>
const cell = document.getElementById("cell");
const face = document.getElementById("face");
const msg = document.getElementById("msg");
const clock = document.getElementById("clock");
const mines = document.getElementById("mines");
const againRow = document.getElementById("againRow");

let won = +(localStorage.getItem("mines_wins") || 0);
let done = false, seconds = 0, timerId = null;

function startGame() {
  done = false; seconds = 0;
  clock.textContent = "000";
  mines.textContent = "💣 001";
  face.textContent = "🙂";
  cell.textContent = "❓";
  cell.classList.remove("open");
  msg.textContent = "就一个格子。你不会踩雷的。大概。";
  againRow.classList.remove("show");
  clearInterval(timerId);
  timerId = setInterval(() => {
    seconds++;
    clock.textContent = String(Math.min(seconds, 999)).padStart(3, "0");
  }, 1000);
}

function win(byFlag) {
  if (done) return;
  done = true;
  clearInterval(timerId);
  face.textContent = "😎";
  cell.textContent = byFlag ? "🚩" : "🎉";
  cell.classList.add("open");
  won++;
  localStorage.setItem("mines_wins", won);
  msg.textContent = byFlag
    ? `用旗子赢的，不算本事……但也算。胜场 ${won}，败场 0。`
    : `你赢了！职业生涯 ${won} 胜 0 负，胜率 100%。`;
  if (window.Toy) Toy.say(byFlag ? "插旗赢法，掌握在少数人手里。" : "干净利落。你的胜率依然 100%。");
  againRow.classList.add("show");
}

cell.addEventListener("click", () => win(false));
cell.addEventListener("contextmenu", e => { e.preventDefault(); win(true); });
let pressTimer = null;
cell.addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch") return;
  pressTimer = setTimeout(() => { pressTimer = null; win(true); }, 500);
});
cell.addEventListener("pointerup", () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
document.getElementById("again").addEventListener("click", startGame);
startGame();
window.__mines = () => ({ done, won });
</script>
<script src="../toys-common.js" data-bgm="retro" data-lines='["这是你唯一能赢的扫雷","手机长按格子，插旗也算赢","职业生涯胜率永远 100%"]'></script>
</body>
</html>
