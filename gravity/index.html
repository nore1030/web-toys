<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>引力沙盒 🌌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #04060f; color: #cfd8ea;
  }
  #cv { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 5; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  .hud h1 { font-size: 22px; letter-spacing: 2px; color: #fff; }
  .hud p { font-size: 13px; color: #93a4c4; margin-top: 6px; line-height: 1.7; }
  .hud p b { color: #ffd76e; }
  .ctrl {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; gap: 10px; align-items: center;
    background: rgba(10, 14, 28, .72); border: 1px solid rgba(120, 150, 220, .25);
    border-radius: 999px; padding: 8px 14px; backdrop-filter: blur(6px);
  }
  .ctrl button {
    border: none; background: transparent; color: #cfd8ea; font-family: inherit;
    font-size: 13.5px; font-weight: 700; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  .ctrl button:hover { background: rgba(120, 150, 220, .15); }
  .ctrl .count { font-size: 12.5px; color: #7f92b8; font-variant-numeric: tabular-nums; padding: 0 4px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <h1>🌌 引力沙盒</h1>
  <p>点一下，放下一个<b>引力源</b>，粒子会自己找路<br>长按引力源可以把它抹掉</p>
</div>
<div class="ctrl">
  <button id="burst">✨ 撒一把粒子</button>
  <button id="clear">🧹 清空重来</button>
  <span class="count">粒子 <span id="pn">0</span></span>
</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#04060f";
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener("resize", resize);
resize();

const particles = [];  // {x,y,vx,vy}
const wells = [];      // {x,y,born}
const G = 140;

function spawn(x, y, burst) {
  if (burst) {
    const n = 70;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 5;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
    }
  } else {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * 2, vy: (Math.random() - .5) * 2,
    });
  }
}
for (let i = 0; i < 350; i++) spawn(0, 0, false);

function addWell(x, y) {
  wells.push({ x, y, born: performance.now() });
  spawn(x, y, true);
}

// 交互
let pressTimer = null, pressPt = null;
cv.addEventListener("pointerdown", e => {
  pressPt = { x: e.clientX, y: e.clientY, t: performance.now() };
  pressTimer = setTimeout(() => {
    // 长按：删除最近的引力源
    let best = -1, bd = 1e9;
    wells.forEach((w, i) => {
      const d = Math.hypot(w.x - pressPt.x, w.y - pressPt.y);
      if (d < bd) { bd = d; best = i; }
    });
    if (best >= 0 && bd < 70) { wells.splice(best, 1); }
    pressTimer = null; pressPt = null;
  }, 550);
});
cv.addEventListener("pointerup", e => {
  if (pressTimer) {
    clearTimeout(pressTimer);
    pressTimer = null;
    addWell(e.clientX, e.clientY);
  }
  pressPt = null;
});
cv.addEventListener("pointermove", e => {
  if (pressTimer && pressPt && Math.hypot(e.clientX - pressPt.x, e.clientY - pressPt.y) > 24) {
    clearTimeout(pressTimer); pressTimer = null; // 拖动不算长按
  }
});

document.getElementById("burst").addEventListener("click", () => {
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < 150; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * Math.min(W, H) * 0.4;
    particles.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: 0, vy: 0 });
  }
});
document.getElementById("clear").addEventListener("click", () => {
  particles.length = 0; wells.length = 0;
  for (let i = 0; i < 350; i++) spawn(0, 0, false);
  ctx.fillStyle = "#04060f"; ctx.fillRect(0, 0, W, H);
});
window.__wells = () => wells.length; // 测试用

const pn = document.getElementById("pn");
function step(now) {
  // 物理
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    for (const w of wells) {
      const dx = w.x - p.x, dy = w.y - p.y;
      const r2 = dx * dx + dy * dy + 1200;
      const inv = G / (r2 * Math.sqrt(r2));
      p.vx += dx * inv; p.vy += dy * inv;
    }
    p.vx *= 0.9995; p.vy *= 0.9995;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 14) { p.vx *= 14 / sp; p.vy *= 14 / sp; }
    p.x += p.vx; p.y += p.vy;
    if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) {
      // 飘太远的回收，从边缘重新撒
      particles.splice(i, 1);
      spawn(0, 0, false);
    }
  }
  if (particles.length > 1200) particles.splice(0, particles.length - 1200);

  // 画：半透明覆盖形成拖尾
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(4, 6, 15, 0.09)";
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const sp = Math.hypot(p.vx, p.vy);
    const t = Math.min(sp / 10, 1);
    const hue = 215 - t * 215; // 慢=蓝 快=橙红
    ctx.fillStyle = `hsla(${hue}, 90%, ${55 + t * 25}%, .8)`;
    ctx.fillRect(p.x, p.y, 1.6, 1.6);
  }
  // 引力源
  for (const w of wells) {
    const age = (now - w.born) / 1000;
    const pulse = 1 + Math.sin(now / 300 + w.x) * 0.18;
    const grd = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, 26 * pulse);
    grd.addColorStop(0, "rgba(255, 235, 180, .95)");
    grd.addColorStop(0.25, "rgba(255, 200, 120, .55)");
    grd.addColorStop(1, "rgba(255, 180, 80, 0)");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(w.x, w.y, 26 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(w.x, w.y, 2.6, 0, Math.PI * 2); ctx.fill();
  }
  pn.textContent = particles.length;
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
</html>
